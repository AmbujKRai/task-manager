openapi: 3.0.0
info:
  title: Task Manager API
  version: 1.0.0
  description: REST API with JWT Auth & Role-Based Access Control

servers:
  - url: http://localhost:5000/api/v1
    description: Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: John Doe }
        email: { type: string, example: john@example.com }
        password: { type: string, example: secret123 }
        role: { type: string, enum: [user, admin], example: user }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: john@example.com }
        password: { type: string, example: secret123 }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Build REST API }
        description: { type: string, example: Complete the intern assignment }
        status: { type: string, enum: [pending, in-progress, done], example: pending }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: User registered successfully }
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: Login successful, returns JWT token }
        '401': { description: Invalid credentials }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged in user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile }
        '401': { description: Unauthorized }

  /tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks (user sees own, admin sees all)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of tasks }
    post:
      tags: [Tasks]
      summary: Create a new task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201': { description: Task created }

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get a task by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task found }
        '404': { description: Task not found }
    put:
      tags: [Tasks]
      summary: Update a task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200': { description: Task updated }
    delete:
      tags: [Tasks]
      summary: Delete a task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task deleted }

  /admin/users:
    get:
      tags: [Admin]
      summary: Get all users (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of all users }
        '403': { description: Admins only }